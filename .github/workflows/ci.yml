name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: test
        run: go test -race -count=1 ./...

      - name: build linux/amd64
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o glkvm ./cmd/glkvm

      - name: check linux/amd64 is static
        run: file glkvm | grep "statically linked"

      - name: upload linux/amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: glkvm-linux-amd64
          path: glkvm

      - name: build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o glkvm-linux-arm64 ./cmd/glkvm

      - name: check linux/arm64 is static
        run: file glkvm-linux-arm64 | grep "statically linked"

      - name: upload linux/arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: glkvm-linux-arm64
          path: glkvm-linux-arm64
